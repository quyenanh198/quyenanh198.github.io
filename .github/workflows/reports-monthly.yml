name: Monthly market report

on:
  schedule:
    # 01:30 UTC ngày 1 hằng tháng = 08:30 sáng giờ Việt Nam, báo cáo cho tháng vừa kết thúc
    - cron: "30 1 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate monthly report
        run: node scripts/generate-monthly.mjs
      - name: Commit new reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/reports
          if git diff --cached --quiet; then
            echo "No new reports to commit"
          else
            git commit -m "Auto: monthly report $(date -u +%F)"
            git push
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
